<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>카페 주문 v3.0</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 디자인: 카페 카운터 느낌의 크림 배경 + 에스프레소 포인트. HOT은 주황, ICE는 파랑으로 일관되게 구분한다. */
:root{
  --bg:#F7F3EE; --surface:#FFFFFF; --surface-2:#FBF8F4; --ink:#2A211C; --muted:#7A6E66; --line:#E8DFD6;
  --accent:#6B3E26; --accent-ink:#FFFFFF; --accent-soft:#F3E7DC;
  --hot:#C2410C; --hot-bg:#FDEBDD; --ice:#1D6FB8; --ice-bg:#E3EFFA;
  --good:#2F7D4F; --good-bg:#E3F2E8; --bad:#B42318; --bad-bg:#FDECEA; --warn:#8A5A00; --warn-bg:#FFF3D6;
  --shadow:0 1px 2px rgba(42,33,28,.06),0 6px 20px rgba(42,33,28,.06);
  --f:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16120F; --surface:#1F1915; --surface-2:#251E19; --ink:#F1E9E2; --muted:#A89A8F; --line:#3A2F28;
    --accent:#E0A47A; --accent-ink:#1A120D; --accent-soft:#3A2A20;
    --hot:#FB9A62; --hot-bg:#3D2214; --ice:#7DB8F0; --ice-bg:#142838;
    --good:#7BD39A; --good-bg:#17301F; --bad:#FF8F85; --bad-bg:#3A1715; --warn:#F2C56B; --warn-bg:#35290F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16120F; --surface:#1F1915; --surface-2:#251E19; --ink:#F1E9E2; --muted:#A89A8F; --line:#3A2F28;
  --accent:#E0A47A; --accent-ink:#1A120D; --accent-soft:#3A2A20;
  --hot:#FB9A62; --hot-bg:#3D2214; --ice:#7DB8F0; --ice-bg:#142838;
  --good:#7BD39A; --good-bg:#17301F; --bad:#FF8F85; --bad-bg:#3A1715; --warn:#F2C56B; --warn-bg:#35290F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f);letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
h3{font-size:16px;font-weight:700}
code{font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:0 4px}
.app{max-width:1040px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 120px}
.hidden{display:none!important}
.muted{color:var(--muted)}.hint{font-size:13px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ── 상단 바 ── */
.top{position:sticky;top:0;z-index:30;margin:0 -16px 20px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:20px;flex:none}
.brand b{display:block;font-size:17px;font-weight:800;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:12px}
.ver{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:2px}
.nav{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.nav button{border:0;background:none;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:17px}
@media (max-width:600px){.nav{order:3;flex-basis:100%}.nav button{flex:1;padding:8px 6px}}

/* ── 공통 요소 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.danger:hover:not(:disabled){border-color:var(--bad)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.lg{min-height:52px;padding:0 24px;font-size:17px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.inp{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.inp.s{min-height:38px;padding:0 9px}
select.inp{padding-right:4px}
textarea.inp{min-height:130px;padding:10px 12px;line-height:1.6;resize:vertical}
.lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:600;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.grow{flex:1 1 auto}
.stack{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.card+.card{margin-top:14px}
.card>h3{margin-bottom:4px}
.card>.hint{margin-bottom:12px}
.chip{display:inline-flex;align-items:center;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.02em;line-height:1.7;vertical-align:1px}
.chip.hot{background:var(--hot-bg);color:var(--hot)}
.chip.ice{background:var(--ice-bg);color:var(--ice)}
.badge{display:inline-flex;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.badge.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.note{padding:10px 12px;border-radius:10px;font-size:14px;background:var(--surface-2);margin-top:10px}
.note.ok{background:var(--good-bg);color:var(--good)}
.note.err{background:var(--bad-bg);color:var(--bad)}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note:empty{display:none}
.empty{padding:28px 16px;border:1.5px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{padding:8px;text-align:left;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl .t{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.tbl .p{white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums}
.tbl tr.paid td.dim{color:var(--muted)}
.tbl input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);cursor:pointer}
.tbl .who{display:block;margin-top:3px;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi span{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.kpi strong{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.main span{color:inherit;opacity:.8}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.check{display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent)}

/* ── 주문 화면 ── */
.order{max-width:780px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.hero h2{font-size:26px}
.hero p{color:var(--muted);margin-top:2px}
.name-inp{min-height:54px;font-size:18px;font-weight:600}
.name-inp.shake{animation:shake .35s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mine{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:14px 16px}
.mine-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.mine-it{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.mine-it .t{color:var(--muted);font-variant-numeric:tabular-nums}
.menu-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.menu-tools h2{margin-right:auto}
.menu-tools .inp{width:auto;flex:0 1 220px;min-height:38px}
/* 메뉴판 리스트: 한 줄에 메뉴 하나, 오른쪽 HOT / ICE 열에서 바로 고른다 */
.mlist{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.mhead,.mrow{display:grid;grid-template-columns:minmax(0,1fr) 112px 112px;gap:8px;align-items:center;padding:10px 14px}
.mhead{background:var(--surface-2);border-bottom:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted)}
.mhead .h{text-align:center;color:var(--hot)}.mhead .i{text-align:center;color:var(--ice)}
.mrow+.mrow{border-top:1px solid var(--line)}
.mrow.on{background:var(--accent-soft)}
.mname{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.tbtn{min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;border:1.5px solid var(--line);border-radius:12px;background:var(--surface-2);cursor:pointer;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.tbtn small{font-size:11px;font-weight:800;letter-spacing:.04em}
.tbtn.hot small{color:var(--hot)}.tbtn.ice small{color:var(--ice)}.tbtn.none small{color:var(--muted)}
.tbtn.hot:hover{border-color:var(--hot)}.tbtn.ice:hover{border-color:var(--ice)}.tbtn.none:hover{border-color:var(--accent)}
.tbtn.hot[aria-pressed="true"]{border-color:var(--hot);background:var(--hot);color:#fff}
.tbtn.ice[aria-pressed="true"]{border-color:var(--ice);background:var(--ice);color:#fff}
.tbtn.none[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.tbtn[aria-pressed="true"] small{color:inherit}
.tbtn.wide{grid-column:2 / 4}
.tna{min-height:48px;display:grid;place-items:center;border:1.5px dashed var(--line);border-radius:12px;color:var(--muted);font-size:12px}
@media (max-width:480px){.mhead,.mrow{grid-template-columns:minmax(0,1fr) 86px 86px;padding:10px}.mname{font-size:15px}}
.pwbig{font-size:44px;font-weight:800;letter-spacing:.18em;color:var(--accent);margin:6px 0 8px}
.sidepw{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.sidepw b{font-size:16px;letter-spacing:.08em;margin-left:4px}
.obar{position:sticky;bottom:max(12px,env(safe-area-inset-bottom));z-index:20;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(42,33,28,.16)}
.obar .sel{flex:1;min-width:0}
.obar .sel b{font-size:16px}
.obar .sel small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── 주문확인 / 설정 ── */
.narrow{max-width:400px;margin:40px auto 0}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.settings{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;align-items:start}
.side{position:sticky;top:84px;display:grid;gap:12px}
.who{padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.who b{display:block}
.stabs{display:grid;gap:2px}
.stab{display:flex;align-items:center;justify-content:space-between;gap:6px;border:0;background:none;text-align:left;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600}
.stab:hover{background:var(--surface-2)}
.stab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
@media (max-width:760px){
  .settings{grid-template-columns:1fr}
  .side{position:static}
  .stabs{display:flex;overflow-x:auto;gap:4px;padding-bottom:4px}
  .stab{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface)}
}
.photo-row{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.thumb{width:150px;height:150px;border-radius:12px;border:1px solid var(--line);object-fit:cover;background:var(--surface-2);cursor:zoom-in;flex:none}
.thumb.empty{display:grid;place-items:center;color:var(--muted);font-size:13px;cursor:default}
.erow{display:grid;grid-template-columns:minmax(0,1fr) 96px 96px repeat(3,34px);gap:6px;align-items:center;margin-bottom:6px}
.erow.h{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.erow .x{min-height:38px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;color:var(--muted);padding:0}
.erow .x:disabled{opacity:.35;cursor:default}
@media (max-width:520px){.erow{grid-template-columns:minmax(0,1fr) 80px 80px 34px}.erow .mv{display:none}}
.perm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 14px;margin:10px 0}
.acct{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.release{border-left:3px solid var(--line);padding:2px 0 2px 14px;margin-bottom:16px}
.release.cur{border-left-color:var(--accent)}
.release ul{margin:6px 0 0;padding-left:18px}.release li{margin:3px 0;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.mchip{border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface-2);font-size:14px}
.mchip b{font-variant-numeric:tabular-nums}
.banner{margin-bottom:14px}

/* ── 토스트 / 대화상자 ── */
.toasts{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:60;display:grid;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;box-shadow:var(--shadow);text-align:center;animation:pop .2s ease-out}
.toast.err{background:var(--bad);color:#fff}
.toast.ok{background:var(--good);color:#fff}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
dialog{border:0;border-radius:18px;padding:0;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:min(92vw,460px)}
dialog::backdrop{background:rgba(20,14,10,.45)}
.dlg{padding:20px;display:grid;gap:16px}
.dlg p{white-space:pre-line}
dialog.photo{max-width:min(96vw,900px)}
dialog.photo img{display:block;max-width:100%;max-height:80vh;border-radius:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-in">
      <button class="brand" data-go="order" aria-label="주문 화면으로">
        <span class="logo" aria-hidden="true">☕</span>
        <span><b>카페 주문<span class="ver" id="ver"></span></b><small id="today"></small></span>
      </button>
      <nav class="nav" aria-label="화면 이동">
        <button data-go="order">주문하기</button>
        <button data-go="check">주문확인</button>
        <button data-go="settings">설정</button>
      </nav>
      <button class="icon-btn" data-act="theme" id="themeBtn" aria-label="화면 테마 바꾸기"></button>
    </div>
  </header>
  <div id="banner" class="banner"></div>
  <main id="main"></main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<dialog id="askDlg"><form method="dialog" class="dlg"><p id="askMsg"></p><div class="row end"><button class="btn" value="cancel">취소</button><button class="btn primary" value="ok" id="askOk">확인</button></div></form></dialog>
<dialog id="photoDlg" class="photo"><form method="dialog" class="dlg"><div class="row"><h3 class="grow">메뉴판 사진</h3><button class="btn sm" value="close">닫기</button></div><img id="photoImg" alt="메뉴판 사진"></form></dialog>
<input id="menuPhoto" type="file" accept="image/*" hidden>
<input id="menuCsv" type="file" accept=".csv,.txt,text/csv" hidden>
<input id="dbImport" type="file" accept=".json,application/json" hidden>

<script>
(() => {
'use strict';

/* =====================================================================
   상수
   ===================================================================== */
const VERSION = '3.2';
const LEGACY_KEY = 'cafeOrderApp_v10';           // v1.x · v2.0(단일 파일) 저장 데이터
const LEGACY_BRAND_KEY = 'cafeOrderBrandMenus_v1';
const TESSERACT_SRC = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
const BRANDS = ['스타벅스', '메가커피', '컴포즈커피', '빽다방', '이디야커피', '투썸플레이스', '사용자 지정'];
const PERMS = [
  ['menuAdmin', '메뉴 관리 (사진·CSV·메뉴표)'],
  ['brandMenus', '브랜드별 메뉴판 저장/불러오기'],
  ['orderPreview', '주문 현황 · 공유'],
  ['checkPassword', '주문확인 비밀번호'],
];
const TABS = [
  { k: 'menu', label: '메뉴 관리', perm: 'menuAdmin' },
  { k: 'brand', label: '브랜드 메뉴판', perm: 'brandMenus' },
  { k: 'orders', label: '주문 현황', perm: 'orderPreview' },
  { k: 'share', label: '공유', perm: 'orderPreview' },
  { k: 'checkpw', label: '주문확인 비밀번호', perm: 'checkPassword' },
  { k: 'ai', label: 'AI 연결', admin: true },
  { k: 'data', label: '데이터 · DB', admin: true },
  { k: 'accounts', label: '계정 · 권한', admin: true },
  { k: 'logs', label: '로그인 기록', admin: true },
  { k: 'mypw', label: '내 비밀번호' },

  "  if (!s) { s = ss.insertSheet(SHEET); s.appendRow(['path', 'json', 'ts']); s.setFrozenRows(1); }",
  '  return s;',
  '}',
  'function out_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }',
  '',
  "function doGet() { return out_({ ok: true, app: 'cafe-order-sheet' }); }",
  '',
  'function doPost(e) {',
  '  var req;',
  "  try { req = JSON.parse(e.postData.contents); } catch (x) { return out_({ ok: false, error: 'bad-request' }); }",
  "  if (TOKEN.indexOf('여기에') === 0) return out_({ ok: false, error: 'token-not-set' });",
  "  if (req.token !== TOKEN) return out_({ ok: false, error: 'token' });",
  '  var lock = LockService.getScriptLock(); lock.waitLock(20000);',
  '  try {',
  '    var s = sheet_(), now = Date.now(), last = s.getLastRow();',
  "    if (req.op === 'read') {",
  '      var since = Number(req.since) || 0, rows = [];',
  '      var vals = last > 1 ? s.getRange(2, 1, last - 1, 3).getValues() : [];',
  '      for (var i = 0; i < vals.length; i++) if (Number(vals[i][2]) > since) rows.push([String(vals[i][0]), String(vals[i][1]), Number(vals[i][2])]);',
  '      return out_({ ok: true, now: now, rows: rows });',
  '    }',
  "    if (req.op === 'write') {",
  '      var paths = last > 1 ? s.getRange(2, 1, last - 1, 1).getValues() : [], index = {}, add = [], addAt = {};',
  '      for (var j = 0; j < paths.length; j++) index[String(paths[j][0])] = j + 2;',
  '      (req.ops || []).forEach(function (op) {',
  "        var p = String(op.path), row = [p, String(op.json || ''), now];",
  '        if (index[p]) s.getRange(index[p], 1, 1, 3).setValues([row]);',
  '        else if (addAt[p] !== undefined) add[addAt[p]] = row;',
  '        else { addAt[p] = add.length; add.push(row); }',
  '      });',
  '      if (add.length) s.getRange(s.getLastRow() + 1, 1, add.length, 3).setValues(add);',
  '      return out_({ ok: true, now: now });',
  '    }',
  '    return out_({ ok: true, now: now, rows: Math.max(0, last - 1) });',
  '  } finally { lock.releaseLock(); }',
  '}',
].join('\n');

/* =====================================================================
   CSV / 텍스트 → 메뉴
   메뉴 한 행 = {id, name, temp:'HOT'|'ICE'|'-', price}. 핫/아이스 모두 되는 메뉴는 두 행.
   ===================================================================== */
function parseCSV(text) {
  text = String(text).replace(/^\uFEFF/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const delim = [',', '\t', ';'].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; rows.push(row); row = []; }
    else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}
function tempsOf(raw) {
  const t = String(raw || '').trim().toLowerCase();
  if (/(핫.*[\/,&·+].*아이스|아이스.*[\/,&·+].*핫|hot.*[\/,&+].*ice|ice.*[\/,&+].*hot|둘다|both|h\/i)/.test(t)) return ['HOT', 'ICE'];
  if (/^(핫|hot|h$|뜨거운|따뜻)/.test(t)) return ['HOT'];
  if (/^(아이스|ice|i$|차가운|냉)/.test(t)) return ['ICE'];
  return ['-'];
}
function csvToMenu(text) {
  const rows = parseCSV(text), out = []; let skipped = 0;
  if (!rows.length) return { menu: [], skipped: 0 };
  const isNum = x => /^[\d,.\s]*\d[\d,.\s]*(원)?$/.test(String(x).trim());
  const h = rows[0].map(x => String(x).trim());
  const fi = re => h.findIndex(x => re.test(x));
  let iN = 0, iT = 1, iP = 2, hasHeader = false;
  if (h.some(x => /메뉴|이름|name|menu|가격|price/i.test(x)) && !rows[0].some(isNum)) {
    hasHeader = true;
    const a = fi(/메뉴|이름|name|menu/i), b = fi(/구분|온도|옵션|핫|temp/i), c = fi(/가격|금액|price/i);
    if (a >= 0) iN = a; iT = b; if (c >= 0) iP = c;
    if (b < 0 && c < 0) { iT = -1; iP = 1; }
  } else if (rows[0].length === 2) { iT = -1; iP = 1; }
  rows.slice(hasHeader ? 1 : 0).forEach(r => {
    const name = String(r[iN] || '').trim();
    const ps = String(r[iP] ?? '').replace(/[,\s원]/g, '');
    let price = Number(ps); if (price > 0 && price < 100) price *= 1000; price = Math.round(price);
    if (!name || !isFinite(price) || ps === '') { skipped++; return; }
    tempsOf(iT >= 0 ? r[iT] : '').forEach(t => out.push({ id: 'm' + uid(), name: name.slice(0, 40), temp: t, price: Math.max(0, price) }));
  });
  return { menu: out, skipped };
}
function textToCSV(text) { // 자유 형식 텍스트(한 줄에 메뉴 하나)를 CSV로 바꾼다
  const lines = String(text).replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim());
  if (lines.some(l => /[,\t;]/.test(l.replace(/\d,(?=\d{3})/g, '')))) return lines.join('\n');
  const out = ['메뉴,구분,가격'];
  lines.forEach(l => {
    const m = l.trim().match(/^(.*?)[\s:\-–]*([\d][\d,.]*)\s*원?\s*$/);
    if (!m) { out.push('"' + l.trim().replace(/"/g, '""') + '",,'); return; }
    let name = m[1], t = '';
    const tm = name.match(/(핫\s*\/\s*아이스|아이스\s*\/\s*핫|핫|아이스|hot\s*\/\s*ice|hot|ice)/i);
    if (tm) { t = tm[1].replace(/\s/g, ''); name = name.replace(tm[0], ''); }
    name = name.replace(/[()\[\]]/g, ' ').replace(/\s+/g, ' ').trim();
    out.push('"' + name.replace(/"/g, '""') + '",' + t + ',' + m[2].replace(/,/g, ''));
  });
  return out.join('\n');
}
function ocrToMenu(text) { // OCR 결과 텍스트에서 "메뉴명 … 가격" 줄을 찾는다
  const out = [];
  for (const raw of String(text || '').split(/\r?\n/)) {
    const line = raw.replace(/\s+/g, ' ').trim(); if (!line) continue;
    const prices = [...line.matchAll(/(?:₩|￦)?\s*(\d{1,3}(?:[,.]\d{3})+|\d{1,2}\.\d|\d{3,6})\s*(?:원)?/g)];
    if (!prices.length) continue;
    const p = prices[prices.length - 1];
    let price = Number(p[1].replace(/,/g, '')); if (price > 0 && price < 100) price = Math.round(price * 1000);
    if (!isFinite(price) || price < 100) continue;
    let name = (line.slice(0, p.index) + ' ' + line.slice(p.index + p[0].length));
    const temps = tempsOf((name.match(/핫\s*\/\s*아이스|hot\s*\/\s*ice|아이스|핫|\bice\b|\bhot\b/i) || [''])[0]);
    name = name.replace(/[₩￦|:：\-–—·•.]+/g, ' ').replace(/\b(HOT|ICE)\b|아이스|핫|\//gi, ' ').replace(/^\s*\d+[).]?\s+/, '').replace(/\s+/g, ' ').trim();
    if (name.length < 2 || /^(메뉴|가격|금액|합계|total|price)$/i.test(name)) continue;
    temps.forEach(t => { if (!out.some(x => x.name === name && x.temp === t)) out.push({ id: 'm' + uid(), name: name.slice(0, 40), temp: t, price }); });
  }
  return out;
}
function decodeText(buf) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch (e) { try { return new TextDecoder('euc-kr').decode(buf); } catch (x) { return new TextDecoder().decode(buf); } }
}
const csvCell = x => { x = String(x ?? ''); return /[",\r\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; };
const toCSV = rows => '\uFEFF' + rows.map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n';
const TEMP_KO = { HOT: '핫', ICE: '아이스', '-': '' };
const menuToCSV = menu => toCSV([['메뉴', '구분', '가격'], ...menu.map(m => [m.name, TEMP_KO[m.temp] || '', m.price])]);
function download(name, data, type) {
  const blob = data instanceof Blob ? data : new Blob([data], { type: type || 'text/plain' });
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(u); a.remove(); }, 800);
}
function loadScript(src) {
  return new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); });
}
function shrinkImage(file) { // 저장 공간을 아끼려고 JPEG 230KB 이하로 줄인다
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let max = 1400, q = 0.8, out = '';
      for (let n = 0; n < 8; n++) {
        const sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL('image/jpeg', q);
        if (out.length < 230000) return res(out);
        if (q > 0.5) q -= 0.1; else max = Math.round(max * 0.8);
      }
      rej(new Error('too large'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('decode')); };
    img.src = url;
  });
}

function ask(msg, okLabel, danger) {

  return new Promise(r => {
    const f = d.querySelector('form');
    const done = v => { f.removeEventListener('submit', onSub); d.removeEventListener('close', onClose); r(v); };
    const onSub = e => done(e.submitter?.value === 'ok');
    const onClose = () => done(d.returnValue === 'ok');

}

  const tempMap = { both: ['HOT', 'ICE'], hot: ['HOT'], ice: ['ICE'], none: ['-'] };
  const menu = [];
  (old.menus || []).forEach(m => (tempMap[m.temp] || ['-']).forEach(t => menu.push({ id: 'm' + uid(), name: String(m.name).slice(0, 40), temp: t, price: Number(m.price) || 0 })));
  const orders = {};
  (old.orders || []).forEach(o => { orders[o.id || uid()] = { ts: o.time, name: o.name, menu: o.menu, temp: o.temp === 'HOT' || o.temp === 'ICE' ? o.temp : '-', price: Number(o.price) || 0, paid: !!o.paid }; });
  const list = old.users.map(u => ({ id: u.username, ph: hash(u.username, u.password), role: u.role === 'admin' ? 'admin' : 'user', must: !!u.mustChange, perms: u.sections || undefined }));
  const logs = {};
  (old.logs || []).forEach((l, i) => { logs['legacy' + i] = { ts: l.time, id: l.username, type: 'login', ok: l.result === '성공' }; });
  const data = { config: { main: { menu, checkPw: old.checkPassword || '1234' }, accounts: { list } }, orders, logs };
  if (old.menuPhoto) data.config.image = { data: old.menuPhoto, ts: Date.now() };
  const oldBrands = lsGet(LEGACY_BRAND_KEY, null);
  if (oldBrands) {
    const map = {};
    Object.entries(oldBrands).forEach(([b, l]) => { map[b] = []; (l || []).forEach(m => (tempMap[m.temp] || ['-']).forEach(t => map[b].push({ name: m.name, temp: t, price: Number(m.price) || 0 }))); });
    data.config.brands = { map };
  }
  try {
    await LocalDB.restore(data, 'merge');
    toast(`이전 버전 데이터를 가져왔습니다 (메뉴 ${menu.length}행 · 주문 ${Object.keys(orders).length}건).`, 'ok', 4000);
  } catch (e) { toast('이전 데이터를 가져오지 못했습니다. 저장 공간이 부족할 수 있습니다.', 'err'); }
}

/* =====================================================================
   화면 렌더링
   뷰는 이동할 때 한 번 그리고, 데이터가 바뀌면 [data-paint] 영역만 다시 그린다(입력 중인 칸을 지키기 위해).
   ===================================================================== */
const PAINT = {};
function paint(name, force) { $$(`[data-paint="${name}"]`).forEach(el => PAINT[name](el, force)); }
function paintAll() { $$('[data-paint]').forEach(el => PAINT[el.dataset.paint]?.(el)); }

function paintBanner() {
  let t = '';
  const st = S.dbMode === 'sheet' ? S.db.status : null;
  if (st && !st.ready) t = st.err ? `구글 시트에 연결하지 못했습니다: ${st.err}. 계속 다시 시도합니다. 설정 → 데이터 · DB에서 연결을 확인하세요.` : '구글 시트에서 데이터를 불러오는 중입니다…';
  else if (st && st.err) t = `구글 시트와 연결이 끊겼습니다: ${st.err}. 마지막 동기화 ${st.last ? hm(st.last) : '-'}. 다시 연결되면 자동으로 이어집니다.`;
  else if (S.dbErr) t = '저장 중 문제가 생겼습니다. 브라우저 저장 공간이 가득 찼거나 막혀 있을 수 있습니다. 설정 → 데이터 · DB에서 백업을 받아 두세요.';
  else if (S.view === 'settings' && S.dbMode === 'fallback') t = 'DB 연결 정보(또는 어댑터)가 없어 이 브라우저 저장소를 사용하고 있습니다.';
  $('#banner').innerHTML = t ? `<div class="note warn" role="status">${esc(t)}</div>` : '';
}
function go(view) { if (location.hash !== '#' + view) location.hash = view; else route(); }
function route() {
  const v = (location.hash || '#order').slice(1);
  const next = ['order', 'check', 'settings'].includes(v) ? v : 'order';
  if (S.view === 'check' && next !== 'check') S.checkOk = false; // 주문확인은 나갈 때 잠금
  S.view = next; renderView();
}
function renderView() {
  $$('.nav [data-go]').forEach(b => { if (b.dataset.go === S.view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  paintBanner();
  const m = $('#main');
  m.innerHTML = S.view === 'order' ? orderView() : S.view === 'check' ? checkView() : settingsView();
  $$('[data-paint]', m).forEach(el => PAINT[el.dataset.paint](el, true));

}

/* ---------------- 주문하기 ---------------- */

async function submitOrder() {

  return `<div class="page-head"><div><h2>주문 내역</h2>${viaLogin ? `<p class="hint">설정에 ${esc(S.session.id)}(으)로 로그인되어 있어 비밀번호 없이 열었습니다.</p>` : ''}</div><div class="row">
      <button class="btn sm" data-act="shareText">💬 텍스트 공유</button><button class="btn sm" data-act="shareImage">🖼️ 이미지 공유</button>${viaLogin ? '' : '<button class="btn sm" data-act="lock">🔒 잠금</button>'}</div></div>
    <div data-paint="checkBody"></div>`;

function sortOrders(list) {
  const a = list.slice(), t = (x, y) => (x.ts || 0) - (y.ts || 0);
  if (S.sort === 'old') a.sort(t);
  else if (S.sort === 'name') a.sort((x, y) => String(x.name).localeCompare(String(y.name), 'ko') || t(x, y));
  else if (S.sort === 'menu') a.sort((x, y) => String(x.menu).localeCompare(String(y.menu), 'ko') || String(x.temp).localeCompare(String(y.temp)) || String(x.name).localeCompare(String(y.name), 'ko'));
  else a.sort((x, y) => t(y, x));
  return a;
}
function aggregate(list) {
  const g = new Map();
  list.forEach(o => {
    const k = label(o);
    if (!g.has(k)) g.set(k, { key: k, menu: o.menu, temp: o.temp, count: 0, unit: Number(o.price) || 0, total: 0, names: [] });
    const v = g.get(k); v.count++; v.total += Number(o.price) || 0; v.names.push(o.name);
  });
  return [...g.values()].sort((a, b) => a.menu.localeCompare(b.menu, 'ko') || String(a.temp).localeCompare(String(b.temp)));
}
function kpis(list) {
  const total = sum(list), paid = sum(list.filter(o => o.paid));
  return `<div class="kpis"><div class="kpi main"><span>합계</span><strong>${won(total)}</strong></div><div class="kpi"><span>주문</span><strong>${list.length}건</strong></div>
    <div class="kpi"><span>입금 확인</span><strong>${won(paid)}</strong></div><div class="kpi"><span>미입금</span><strong>${won(total - paid)}</strong></div></div>`;
}
const sortSeg = () => '<div class="seg" role="group" aria-label="정렬">' + SORTS.map(([v, t]) => `<button data-act="sort" data-v="${v}" aria-pressed="${S.sort === v}">${t}</button>`).join('') + '</div>';
function summaryTable(list) {
  const rows = aggregate(list);
  if (!rows.length) return '';
  return `<div class="card"><div class="sec-head"><h3>메뉴별 수량</h3><label class="check"><input type="checkbox" data-act="names" ${S.showNames ? 'checked' : ''}> 주문자 표시</label></div>
    <div class="scroll"><table class="tbl"><thead><tr><th>메뉴</th><th class="r">수량</th><th class="r">단가</th><th class="r">합계</th></tr></thead><tbody>` +
    rows.map(v => `<tr><td>${labelHtml(v)}${S.showNames ? `<span class="who">${v.names.map(esc).join(', ')}</span>` : ''}</td><td class="r p">${v.count}</td><td class="r p">${won(v.unit)}</td><td class="r p">${won(v.total)}</td></tr>`).join('') +
    `</tbody></table></div></div>`;
}
function ordersTable(list, admin) {
  if (!list.length) return '<div class="empty">아직 들어온 주문이 없습니다.</div>';
  return `<div class="scroll"><table class="tbl"><thead><tr><th>시간</th><th>이름</th><th>메뉴</th><th class="r">가격</th><th>입금</th>${admin ? '<th></th>' : ''}</tr></thead><tbody>` +
    sortOrders(list).map(o => `<tr class="${o.paid ? 'paid' : ''}"><td class="t" title="${esc(fullT(o.ts))}">${hm(o.ts)}</td><td class="dim">${esc(o.name)}</td><td class="dim">${labelHtml(o)}</td><td class="r p dim">${won(o.price)}</td>
      <td>${admin ? `<input type="checkbox" data-act="paid" data-id="${esc(o.id)}" aria-label="${esc(o.name)} 입금 확인" ${o.paid ? 'checked' : ''}>` : `<span class="badge ${o.paid ? 'good' : ''}">${o.paid ? '입금완료' : '미입금'}</span>`}</td>
      ${admin ? `<td class="r"><button class="btn sm danger" data-act="delOrder" data-id="${esc(o.id)}">삭제</button></td>` : ''}</tr>`).join('') +
    '</tbody></table></div>';
}
PAINT.checkBody = el => {
  if (!S.loaded.orders) { el.innerHTML = '<div class="empty">주문을 불러오는 중입니다…</div>'; return; }
  el.innerHTML = kpis(S.orders) + summaryTable(S.orders) +

/* ---------------- 공유 / 내보내기 ---------------- */
function shareText() {
  const d = new Date(), list = sortOrders(S.orders);
  const qty = aggregate(list).map(v => `${label(v)} ${v.count}개`).join('\n') || '없음';
  const detail = list.map(o => `${o.name} / ${label(o)} / ${won(o.price)}`).join('\n') || '없음';
  return `[${d.getMonth() + 1}/${d.getDate()} 카페 주문]\n\n■ 메뉴별 수량\n${qty}\n\n■ 주문자별\n${detail}\n\n합계 ${list.length}건 / ${won(sum(list))}`;
}
function summaryImage(withPaid) {
  const rows = sortOrders(S.orders), d = new Date();
  const lines = [
    [`${d.getMonth() + 1}/${d.getDate()} 카페 주문 ${withPaid ? '현황' : '내역'}`, 'title'], ['', ''],
    ['메뉴별 수량', 'head'], ...aggregate(rows).map(v => [`${label(v)}   ${v.count}개   ${won(v.total)}`, '']), ['', ''],
    ['주문 목록', 'head'], ...rows.map(o => [`${hm(o.ts)}   ${o.name}   ${label(o)}   ${won(o.price)}${withPaid ? '   ' + (o.paid ? '입금완료' : '미입금') : ''}`, '']), ['', ''],
    [`합계 ${rows.length}건 / ${won(sum(rows))}`, 'head'],
  ];
  const padX = 36, lineH = 32, c = document.createElement('canvas'), ctx = c.getContext('2d');
  c.width = 1000; c.height = padX * 2 + lines.length * lineH;
  ctx.fillStyle = '#FBF8F4'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = '#6B3E26'; ctx.fillRect(0, 0, 10, c.height);
  ctx.textBaseline = 'top';
  const font = '"Pretendard Variable","Malgun Gothic","Apple SD Gothic Neo",sans-serif';
  lines.forEach(([t, kind], i) => {
    ctx.font = (kind === 'title' ? '800 26px ' : kind === 'head' ? '700 19px ' : '18px ') + font;
    ctx.fillStyle = kind ? '#6B3E26' : '#2A211C';
    ctx.fillText(t, padX, padX + i * lineH, c.width - padX * 2);
  });
  return new Promise(r => c.toBlob(r, 'image/png'));
}
async function doShareText() {
  const text = shareText();
  if (navigator.share) { try { await navigator.share({ title: '카페 주문 내역', text }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(text); toast('주문 내역을 복사했습니다. 메신저에 붙여넣으세요.', 'ok'); }
  catch (e) { toast('자동 복사가 막혀 있습니다. 설정 → 공유 탭에서 직접 복사해 주세요.', 'err'); }
}
async function doShareImage() {
  const blob = await summaryImage(false); if (!blob) return;
  const file = new File([blob], `cafe-order_${fileStamp()}.png`, { type: 'image/png' });
  if (navigator.canShare?.({ files: [file] })) { try { await navigator.share({ title: '카페 주문 내역', files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  download(file.name, blob); toast('이미지를 저장했습니다. 저장한 이미지를 공유해 주세요.', 'ok');
}
const statusOf = o => o.paid ? '입금완료' : '미입금';
const exportOrders = () => download(`cafe-orders_${fileStamp()}.csv`, toCSV([['주문시간', '이름', '메뉴', '구분', '가격', '입금여부'], ...sortOrders(S.orders).map(o => [fullT(o.ts), o.name, o.menu, TEMP_KO[o.temp] || '', o.price, statusOf(o)])]), 'text/csv');
function exportAll() {
  const rows = [['구분', '시간', '이름', '메뉴', '온도', '가격', '입금여부', '수량']];
  S.cfg.menu.forEach(m => rows.push(['등록메뉴', '', '', m.name, TEMP_KO[m.temp] || '', m.price, '', '']));
  S.orders.slice().sort((a, b) => a.ts - b.ts).forEach(o => rows.push(['주문내역', fullT(o.ts), o.name, o.menu, TEMP_KO[o.temp] || '', o.price, statusOf(o), '']));
  aggregate(S.orders).forEach(v => rows.push(['메뉴별현황', '', '', v.menu, TEMP_KO[v.temp] || '', v.total, '', v.count]));
  rows.push(['합계', '', '', '', '', sum(S.orders), '', S.orders.length]);

      <button class="x" data-act="rowDel" data-i="${i}" aria-label="행 삭제">✕</button></div>`).join('');
  el.innerHTML = (n ? `<div class="erow h"><span>메뉴</span><span>구분</span><span>가격(원)</span></div>${rows}` : '<div class="empty">메뉴표가 비어 있습니다. 사진·CSV에서 가져오거나 직접 추가하세요.</div>') +

    <div id="saveMsg"></div>`;

function applyDraft(rows, mode, msgSel, msg) {
  S.draft = mode === 'append' ? S.draft.concat(rows) : rows;
  S.dirty = true; paint('menuEditor', true); paint('stabs');
  note(msgSel, msg, 'ok');
  $('#saveMenu')?.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
async function saveMenu() {
  const seen = new Set();
  for (let i = 0; i < S.draft.length; i++) {
    const m = S.draft[i], name = String(m.name).trim();
    if (!name) return note('#saveMsg', `${i + 1}번째 메뉴 이름이 비어 있습니다.`, 'err');
    if (!(Number(m.price) >= 0) || m.price === '') return note('#saveMsg', `${i + 1}번째 메뉴(${name})의 가격을 확인해 주세요.`, 'err');
    const key = normName(name) + '|' + m.temp;
    if (seen.has(key)) return note('#saveMsg', `${i + 1}번째 행이 중복입니다: ${name} ${m.temp === '-' ? '' : m.temp}`, 'err');
    seen.add(key);
  }
  const menu = S.draft.map(m => ({ id: m.id || 'm' + uid(), name: String(m.name).trim().slice(0, 40), temp: m.temp, price: Math.max(0, Math.round(Number(m.price) || 0)) }));
  if (await guard(saveCfg({ menu }))) { S.dirty = false; paint('menuEditor', true); paint('stabs'); toast(`메뉴 ${menu.length}행을 저장했습니다. 주문 화면에 바로 반영됩니다.`, 'ok'); }
}
async function readWithAI() {
  if (!aiReady()) return note('#photoMsg', 'AI 연결 정보가 없습니다. ' + (isAdmin() ? 'AI 연결 탭에서 API 키를 입력해 주세요.' : '관리자에게 AI 연결을 요청하세요.'), 'err');
  S.reading = true; paint('photoBox'); note('#photoMsg', '메뉴판을 읽는 중입니다. 최대 1분 정도 걸릴 수 있어요…');
  try {
    const txt = await aiCall(AI, READ_PROMPT, S.img);
    const m = String(txt).match(/\[[\s\S]*\]/); let arr = null; try { arr = m && JSON.parse(m[0]); } catch (e) {}
    if (!Array.isArray(arr)) throw { code: 'invalid_json' };
    const rows = arr.map(r => ({ id: 'm' + uid(), name: String(r?.name || '').trim().slice(0, 40), temp: r?.temp === 'HOT' || r?.temp === 'ICE' ? r.temp : '-', price: Math.max(0, Math.round(Number(r?.price) || 0)) })).filter(r => r.name);
    if (!rows.length) throw { code: 'invalid_json' };
    note('#photoMsg', '');
    applyDraft(rows, $('#impMode2')?.value, '#photoMsg', `${rows.length}개 메뉴 행을 읽었습니다. 메뉴표를 확인하고 저장하세요.`);
  } catch (e) { note('#photoMsg', aiErrorText(e), 'err'); }
  finally { S.reading = false; paint('photoBox'); }
}
async function readWithOCR() {
  S.reading = true; paint('photoBox');
  try {
    if (!window.Tesseract) { note('#photoMsg', '글자 인식 도구를 불러오는 중입니다 (처음 한 번, 인터넷 필요)…'); await loadScript(TESSERACT_SRC); }
    const r = await Tesseract.recognize(S.img, 'kor+eng', { logger: m => { if (m.status === 'recognizing text') note('#photoMsg', `글자 인식 중… ${Math.round(m.progress * 100)}%`); } });
    const rows = ocrToMenu(r.data.text);
    if (!rows.length) return note('#photoMsg', '메뉴명과 가격을 찾지 못했습니다. 더 선명한 사진을 올리거나 AI 읽기·붙여넣기를 이용해 주세요.', 'err');
    applyDraft(rows, $('#impMode2')?.value, '#photoMsg', `${rows.length}개 메뉴 행을 찾았습니다. OCR은 틀릴 수 있으니 메뉴표를 꼭 확인하고 저장하세요.`);
  } catch (e) { note('#photoMsg', '글자 인식에 실패했습니다. 인터넷 연결을 확인하거나 다른 방법으로 메뉴를 입력해 주세요.', 'err'); }
  finally { S.reading = false; paint('photoBox'); }
}

    markDirty(); paint('menuEditor', true); note('#saveMsg', '예시 메뉴입니다. 실제 메뉴로 고친 뒤 저장하세요.');
  },
  revertMenu() { S.dirty = false; paint('menuEditor', true); paint('stabs'); },
  saveMenu,
  // 브랜드
  async brandSave() {
    const b = brandName();
    if (!S.cfg.menu.length) return note('#brandMsg', '저장할 메뉴가 없습니다. 먼저 메뉴 관리에서 메뉴를 저장해 주세요.', 'err');
    if (S.brands[b] && !await ask(`'${b}'에 이미 저장된 메뉴판(${S.brands[b].length}행)이 있습니다. 덮어쓸까요?`, '덮어쓰기')) return;
    const map = { ...S.brands, [b]: S.cfg.menu.map(({ name, temp, price }) => ({ name, temp, price })) };
    if (await guard(saveBrands(map))) note('#brandMsg', `'${b}' 메뉴 ${map[b].length}행을 저장했습니다.`, 'ok');
  },
  async brandLoad(t) {
    const b = t.dataset.v, list = S.brands[b] || [];
    if (!await ask(`'${b}' 메뉴판(${list.length}행)으로 현재 메뉴를 바꿀까요?`, '불러오기')) return;
    if (await guard(saveCfg({ menu: list.map(m => ({ id: 'm' + uid(), name: m.name, temp: m.temp || '-', price: Number(m.price) || 0 })) }))) { S.dirty = false; note('#brandMsg', `'${b}' 메뉴를 불러왔습니다. 주문 화면에 바로 반영됩니다.`, 'ok'); }
  },
  async brandDel(t) {
    const b = t.dataset.v;
    if (!await ask(`'${b}' 메뉴판을 삭제할까요?`, '삭제', true)) return;
    const map = { ...S.brands }; delete map[b];
    if (await guard(saveBrands(map))) note('#brandMsg', `'${b}' 메뉴판을 삭제했습니다.`, 'ok');
  },
  // 주문 현황
  async delOrder(t) {
    const o = S.orders.find(x => x.id === t.dataset.id); if (!o) return;
    if (await ask(`${o.name}님의 ${label(o)} 주문을 삭제할까요?`, '삭제', true)) await guard(S.db.doc('orders/' + o.id).delete());
  },
  async delAll() {
    if (!await ask(`주문 ${S.orders.length}건을 모두 삭제합니다.\n삭제 전에 전체 현황 CSV와 이미지를 자동으로 저장합니다.`, '저장 후 전체 삭제', true)) return;
    exportAll(); await exportImage();
    for (const o of S.orders.slice()) { if (!await guard(S.db.doc('orders/' + o.id).delete())) return; }
    toast('주문을 모두 삭제했습니다. 저장된 CSV와 이미지를 확인해 주세요.', 'ok', 4000);
  },
  exportOrders, exportAll, exportImage,
  // AI
  async aiTest() {
    const cfg = { provider: $('#aiProv').value, key: $('#aiKey').value.trim(), model: $('#aiModel').value.trim() || aiDefaults($('#aiProv').value).model, endpoint: $('#aiEp').value.trim() };
    if (!cfg.key) return note('#aiMsg', 'API 키를 입력해 주세요.', 'err');
    note('#aiMsg', '연결을 확인하는 중입니다…');
    try { const r = await aiCall(cfg, '"OK"라고만 답하세요.', null); note('#aiMsg', '연결 성공: ' + String(r).slice(0, 40), 'ok'); }
    catch (e) { note('#aiMsg', aiErrorText(e), 'err'); }
  },
  aiClear() { AI.key = ''; lsSet('cafe-ai', AI); renderView(); toast('API 키를 삭제했습니다.', 'ok'); },
  // 데이터
  backup() {
    if (!S.db.dump) return note('#dbMsg', '지금 쓰는 DB 어댑터는 내보내기를 지원하지 않습니다.', 'err');
    download(`cafe-backup_${fileStamp()}.json`, JSON.stringify({ app: 'cafe-order', version: VERSION, data: S.db.dump() }), 'application/json');
    note('#dbMsg', '백업 파일을 만들었습니다. 계정 정보가 들어 있으니 보관에 유의하세요.', 'ok');
  },
  async legacy() { if (await ask('이전 버전 데이터를 현재 데이터에 합칠까요? 같은 주문은 덮어씁니다.', '가져오기')) importLegacy(false); },
  // 계정
  async permSave(t) {
    const i = +t.dataset.i, perms = {};
    $$(`[data-perm="${i}"]`).forEach(c => { perms[c.dataset.key] = c.checked; });
    const list = accounts().map((a, j) => j === i ? { ...a, perms } : a);
    if (await guard(saveAccounts(list))) toast(`${list[i].id} 계정의 권한을 저장했습니다.`, 'ok');
  },
  async acctReset(t) {
    const a = accounts()[+t.dataset.i];
    if (!await ask(`${a.id} 계정의 비밀번호를 1234로 초기화할까요? 다음 로그인 때 새 비밀번호를 정하게 됩니다.`, '초기화')) return;
    if (await guard(saveAccounts(accounts().map(x => x.id === a.id ? { ...x, ph: hash(x.id, '1234'), must: true } : x)))) toast(`${a.id} 비밀번호를 초기화했습니다.`, 'ok');
  },
  async acctDel(t) {
    const a = accounts()[+t.dataset.i];
    if (!await ask(`${a.id} 계정을 삭제할까요?`, '삭제', true)) return;
    if (await guard(saveAccounts(accounts().filter(x => x.id !== a.id)))) toast(`${a.id} 계정을 삭제했습니다.`, 'ok');
  },
};

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) { go(g.dataset.go); return; }
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  if (t.type === 'checkbox') return; // 체크박스는 change에서 처리
  ACT[t.dataset.act]?.(t, e);
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.act === 'paid') { if (!await guard(S.db.doc('orders/' + t.dataset.id).update({ paid: t.checked }))) t.checked = !t.checked; return; }
  if (t.dataset.act === 'names') return ACT.names(t);
  if (t.dataset.f) { // 메뉴표 select 변경
    const m = S.draft[+t.dataset.i]; if (m) { m[t.dataset.f] = t.value; markDirty(); }
    return;
  }
  if (t.id === 'brandSel') { $('#brandCustom').disabled = t.value !== '사용자 지정'; return; }
  if (t.id === 'aiProv') { const d = aiDefaults(t.value); $('#aiModel').value = d.model; $('#aiModel').placeholder = d.model; $('#aiEp').value = ''; $('#aiEp').placeholder = d.endpoint; return; }
  if (t.id === 'menuPhoto') {
    const f = t.files?.[0]; t.value = ''; if (!f) return;
    note('#photoMsg', '사진을 줄여서 저장하는 중입니다…');
    try { const data = await shrinkImage(f); if (await guard(S.db.doc('config/image').set({ data, ts: Date.now() }))) note('#photoMsg', '메뉴판 사진을 저장했습니다. AI 또는 OCR로 메뉴를 읽어 보세요.', 'ok'); }
    catch (x) { note('#photoMsg', '사진을 읽지 못했습니다. 다른 사진으로 다시 시도해 주세요.', 'err'); }
    return;
  }
  if (t.id === 'menuCsv') {
    const f = t.files?.[0]; t.value = ''; if (!f) return;
    try {
      const r = csvToMenu(decodeText(await f.arrayBuffer()));
      if (!r.menu.length) return note('#csvMsg', '읽을 수 있는 메뉴 행이 없습니다. 열 순서(메뉴, 구분, 가격)와 가격 숫자를 확인해 주세요.', 'err');
      applyDraft(r.menu, $('#impMode2').value, '#csvMsg', `${r.menu.length}개 메뉴 행을 불러왔습니다${r.skipped ? ` (잘못된 ${r.skipped}행 제외)` : ''}. 메뉴표를 확인하고 저장하세요.`);
    } catch (x) { note('#csvMsg', '파일을 읽지 못했습니다.', 'err'); }
    return;
  }
  if (t.id === 'dbImport') {
    const f = t.files?.[0]; t.value = ''; if (!f) return;
    try {
      const j = JSON.parse(decodeText(await f.arrayBuffer()));
      if (!j || j.app !== 'cafe-order' || !j.data) throw new Error('format');
      const mode = $('#impMode').value;
      if (mode === 'replace' && !await ask('현재 데이터를 모두 지우고 백업 내용으로 바꿉니다. 계속할까요?', '전부 바꾸기', true)) return;
      if (!S.db.restore) throw new Error('unsupported');
      await S.db.restore(j.data, mode);
      note('#dbMsg', '백업을 가져왔습니다.', 'ok');
    } catch (x) { note('#dbMsg', '가져오지 못했습니다. 이 앱에서 내보낸 백업 파일인지 확인해 주세요.', 'err'); }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'oname') { S.name = t.value; lsSet('cafe-name', t.value.trim()); paint('mine'); paint('orderBar'); return; }
  if (t.id === 'mq') { S.q = t.value; paint('menuGrid'); return; }
  if (t.dataset.f && t.tagName === 'INPUT') { const m = S.draft[+t.dataset.i]; if (m) { m[t.dataset.f] = t.value; markDirty(); } }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'oname') { e.preventDefault(); submitOrder(); }
});
document.addEventListener('submit', async e => {
  if (e.target.method === 'dialog') return; // 대화상자 닫기는 브라우저 기본 동작에 맡김
  e.preventDefault();
  const id = e.target.id;
  const notReady = S.dbMode === 'sheet' && !S.db.status.ready; // 시트를 다 불러오기 전에는 기본 계정·비밀번호로 열리지 않게 막음
  if (notReady && (id === 'f-check' || id === 'f-login')) return note(id === 'f-check' ? '#chkMsg' : '#loginMsg', '구글 시트에서 데이터를 불러오는 중입니다. 잠시 후 다시 시도해 주세요.', 'err');
  if (id === 'f-check') {
    if ($('#cpw').value === S.cfg.checkPw) { S.checkOk = true; renderView(); }
    else { note('#chkMsg', '비밀번호가 맞지 않습니다.', 'err'); $('#cpw').select(); }
  } else if (id === 'f-login') {
    const lid = $('#lid').value.trim(), pw = $('#lpw').value, a = accounts().find(x => x.id === lid);
    if (a && a.ph === hash(a.id, pw)) { S.session = { id: a.id }; logEvent(a.id, 'login', true); renderView(); }
    else { logEvent(lid, 'login', false); note('#loginMsg', '아이디 또는 비밀번호가 맞지 않습니다.', 'err'); $('#lpw').select(); }
  } else if (id === 'f-must' || id === 'f-mypw') {
    const must = id === 'f-must', msg = must ? '#mustMsg' : '#mypwMsg';
    const p1 = $(must ? '#np1' : '#mp1').value, p2 = $(must ? '#np2' : '#mp2').value, a = me();
    if (!must && a.ph !== hash(a.id, $('#mp0').value)) return note(msg, '현재 비밀번호가 맞지 않습니다.', 'err');
    if (p1.length < 4 || p1 === '1234') return note(msg, '4자 이상, 1234가 아닌 비밀번호를 입력해 주세요.', 'err');
    if (hash(a.id, p1) === a.ph) return note(msg, '지금 비밀번호와 다른 비밀번호를 입력해 주세요.', 'err');
    if (p1 !== p2) return note(msg, '두 비밀번호가 같지 않습니다.', 'err');
    if (await guard(saveAccounts(accounts().map(x => x.id === a.id ? { ...x, ph: hash(x.id, p1), must: false } : x)))) {
      logEvent(a.id, 'pwchange', true); toast('비밀번호를 변경했습니다.', 'ok'); renderView();
    }
  } else if (id === 'f-checkpw') {
    const v = $('#ncp').value.trim();
    if (v.length < 4) return note('#checkPwMsg', '4자 이상 입력해 주세요.', 'err');
    if (await guard(saveCfg({ checkPw: v, checkPwDate: todayKey(), checkPwBy: 'manual' }))) { $('#ncp').value = ''; note('#checkPwMsg', `주문확인 비밀번호를 ${v}(으)로 바꿨습니다. 오늘 하루 사용됩니다.`, 'ok'); }
  } else if (id === 'f-ai') {
    AI = { provider: $('#aiProv').value, key: $('#aiKey').value.trim(), model: $('#aiModel').value.trim() || aiDefaults($('#aiProv').value).model, endpoint: $('#aiEp').value.trim() };
    { const ok = lsSet('cafe-ai', AI); note('#aiMsg', ok ? 'AI 설정을 저장했습니다.' : '저장하지 못했습니다.', ok ? 'ok' : 'err'); }
  } else if (id === 'f-conn') {
    const next = { type: $('#cnType').value, url: $('#cnUrl').value.trim(), token: $('#cnTok').value.trim() };
    if (next.type === 'sheet') {
      if (!next.url || !next.token) return note('#cnMsg', '웹 앱 URL과 토큰을 입력해 주세요.', 'err');
      note('#cnMsg', '연결을 확인하는 중입니다…');
      try { await sheetCall(next, { op: 'ping' }); } catch (x) { return note('#cnMsg', '연결 실패: ' + sheetErrText(x) + '. 저장하지 않았습니다.', 'err'); }
    }
    if (!lsSet('cafe-conn', next)) return note('#cnMsg', '저장하지 못했습니다.', 'err');
    const same = next.type === CONN.type && next.url === CONN.url && next.token === CONN.token;
    CONN = next;
    if (same) return note('#cnMsg', '저장했습니다.', 'ok');
    note('#cnMsg', next.type === 'remote' && !ADAPTERS.remote ? '저장했습니다. ADAPTERS.remote 어댑터를 넣기 전까지는 이 브라우저에 저장합니다.' : '저장했습니다. 다시 연결합니다…', 'ok');
    setTimeout(() => location.reload(), 900);
  } else if (id === 'f-acct') {
    const nid = $('#nid').value.trim(), npw = $('#npw').value || '1234';
    if (!/^[A-Za-z0-9_가-힣]{2,20}$/.test(nid)) return note('#acctMsg', '아이디는 2~20자의 글자, 숫자, _ 만 쓸 수 있습니다.', 'err');
    if (accounts().some(x => x.id === nid)) return note('#acctMsg', '이미 있는 아이디입니다.', 'err');
    const perms = {}; $$('[data-newperm]').forEach(c => { perms[c.dataset.newperm] = c.checked; });
    if (await guard(saveAccounts(accounts().concat([{ id: nid, ph: hash(nid, npw), role: 'user', must: true, perms }])))) {
      $('#nid').value = ''; $('#npw').value = ''; note('#acctMsg', `${nid} 계정을 추가했습니다.`, 'ok');
    }
  }
});
window.addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('hashchange', route);
$('#photoDlg').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); }); // 사진 바깥(배경)을 누르면 닫힘

/* =====================================================================
   시작
   ===================================================================== */
function setTheme(mode) {
  lsSet('cafe-theme', mode);
  if (mode === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = mode;
  $('#themeBtn').textContent = { auto: '🌓', light: '☀️', dark: '🌙' }[mode];
  $('#themeBtn').title = { auto: '테마: 시스템 설정', light: '테마: 밝게', dark: '테마: 어둡게' }[mode];
}
setTheme(lsGet('cafe-theme', 'auto'));
const d0 = new Date();
$('#today').textContent = `${d0.getMonth() + 1}월 ${d0.getDate()}일 ${'일월화수목금토'[d0.getDay()]}요일`;
$('#ver').textContent = 'v' + VERSION;
document.title = '카페 주문 v' + VERSION;
init();
route();
setInterval(rotateCheckPw, 60000); // 페이지를 켜 둔 채 자정을 넘겨도 바뀌도록
})();
</script>
